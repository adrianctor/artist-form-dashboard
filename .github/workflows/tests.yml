name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, ctype, fileinfo, tokenizer, sqlite3, pdo_sqlite, pdo_mysql, curl, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: JS dependencies
        run: npm ci

      - name: Prepare app
        run: cp .env.example .env && php artisan key:generate --force

      # Green gate: unit/feature tests + build. Pint/vp/phpstan are not
      # wired yet (they fail on the base today) — pending cleanup.
      - name: Run tests
        run: php artisan test

      - name: Build assets
        run: npm run build
